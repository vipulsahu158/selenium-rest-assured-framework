# ---------- Application under test ----------
ui.base.url=https://www.saucedemo.com
api.base.url=https://jsonplaceholder.typicode.com
# Practice site with a page for most UI behaviours (alerts, frames, windows, uploads, drag and drop ...)
practice.base.url=https://the-internet.herokuapp.com
practice.username=tomsmith
practice.password=SuperSecretPassword!
# Restful Booker: free API that really stores data (used for the end-to-end CRUD flow).
# admin/password123 are the public demo credentials published by the site.
api.booker.url=https://restful-booker.herokuapp.com
api.booker.username=admin
api.booker.password=password123

# ---------- Browser ----------
# Default browser when a test is run without the "browser" parameter (testng.xml normally supplies it).
browser=chrome
headless=false
# Leave blank to run locally. Set to e.g. http://localhost:4444 to run on Selenium Grid / Selenoid / cloud.
grid.url=

# ---------- Timeouts (seconds) ----------
explicit.wait=30
page.load.timeout=60
# normal = wait for the full page, eager = wait for the DOM only (faster, avoids stalls on slow ads/images), none
page.load.strategy=eager

# ---------- Data / Reports ----------
testdata.path=src/test/resources/testdata/TestData.xlsx
report.dir=reports
screenshot.dir=reports/screenshots

# Any property above can be overridden from the command line, e.g.
#   mvn test -Dheadless=true -Dapi.base.url=https://staging.example.com

# A failed test is re-run this many times before it is reported as failed (shared demo sites can be flaky).
retry.count=1
